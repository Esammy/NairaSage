# Reference stack for local/prototype deploys. Point REDIS_URL at host Redis if you prefer not to use the redis service.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: nairasage
      POSTGRES_PASSWORD: nairasage
      POSTGRES_DB: nairasage
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  web:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: gunicorn config.wsgi:application --bind 0.0.0.0:8000
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgres://nairasage:nairasage@db:5432/nairasage
      REDIS_URL: redis://redis:6379/0
      DJANGO_SETTINGS_MODULE: config.settings.production
    ports:
      - "8000:8000"
    depends_on:
      - db
      - redis

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: python manage.py rqworker default high low
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgres://nairasage:nairasage@db:5432/nairasage
      REDIS_URL: redis://redis:6379/0
      DJANGO_SETTINGS_MODULE: config.settings.production
    depends_on:
      - db
      - redis

volumes:
  pgdata:
